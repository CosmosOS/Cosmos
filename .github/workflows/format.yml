name: .NET Format

on:
  push:
    branches: [ "main", "gen3" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  format:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ 10.0.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The PublicAPI analyzer records a driver kit symbol as stable API
      # unless it carries [Experimental("COSMOS0003")]; this fails the job on
      # a seam line without the [COSMOS0003] prefix, and on the prefix
      # anywhere outside the seam. Needs no build, so it runs first.
      - name: Check Experimental API Declarations
        run: bash ./.github/scripts/check-experimental-api.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Compile Packages
        run: ./.devcontainer/postCreateCommand.sh

      - name: Restore Dependencies
        run: dotnet restore ./nativeaot-patcher.slnx

      - name: Check Formatting
        run: dotnet format ./nativeaot-patcher.slnx --exclude dotnet --verify-no-changes --severity error || { echo "::error file=Code Formatting::Some files need formatting. Run 'dotnet format' locally."; exit 1; }

