name: Build Tools

# Builds LLVM, xorriso, QEMU and GDB for Linux, macOS and Windows and publishes
# them as the `tools-latest` release, which `cosmos install` and the other
# workflows download.
#
# The Linux tools are built in an ubuntu:22.04 container, the oldest Ubuntu
# release still supported, and not on the runner itself: a binary built against
# an old C library starts on every later one, while one built on the runner
# stops starting on older releases each time `ubuntu-latest` moves on. Each
# package also brings the libraries its tool needs that a bare Ubuntu may lack.
# verify-linux then runs every packaged tool in a bare image of each supported
# release, and nothing is published unless all of them pass.
#
# A pull request that changes this file runs the builds and the verification
# and publishes nothing. Publishing takes a manual run.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-tools.yml

defaults:
  run:
    shell: bash

env:
  # No question from apt in the build containers
  DEBIAN_FRONTEND: noninteractive
  LLVM_VERSION: "22.1.3"
  LLVM_TAG: "llvmorg-22.1.3"
  # libxml2 shipped beside the Linux ld.lld (see build-llvm). 2.13 is the last
  # series whose library is named libxml2.so.2, the name that linker asks for.
  LIBXML2_VERSION: "2.13.9"
  LIBXML2_SHA256: "a2c9ae7b770da34860050c309f903221c67830c86e4a7e760692b803df95143a"
  XORRISO_VERSION: "1.5.8.pl01"
  XORRISO_DIR: "1.5.8"
  QEMU_VERSION: "10.2.2"
  # SDL built for the Linux QEMU (see build-qemu)
  SDL2_VERSION: "2.32.10"
  SDL2_SHA256: "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165"
  GDB_VERSION: "17.1"
  # CPython embedded in gdb for scripting (pretty-printers, kernel debug
  # helpers). macOS bundling paths are keyed on this exact version.
  PYTHON_VERSION: "3.13"
  # The CPython of that series the Linux gdb carries, a standalone build from
  # astral-sh/python-build-standalone (see build-gdb).
  PYTHON_STANDALONE_VERSION: "3.13.18"
  PYTHON_STANDALONE_RELEASE: "20261110"
  PYTHON_STANDALONE_SHA256: "f2d2199eb25880e07863b391cf7124e7ffa1338b0d65600dfcec117c4223a7fb"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  #  LLVM (Clang + LLD) — replaces GCC cross-compilers
  #  Clang handles both x64 and ARM64 via --target= flag
  # ═══════════════════════════════════════════════════════════════════════
  build-llvm:
    name: LLVM ${{ matrix.target }}
    runs-on: ubuntu-latest
    # The oldest Ubuntu release still supported. What is compiled in it asks
    # for its C library or a later one, whatever image the runner has.
    container: ubuntu:22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
          - target: darwin-arm64
          - target: win-x64
          - target: win-arm64
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl xz-utils zip

      - name: Download & repackage LLVM
        shell: bash
        run: |
          # Map target to official LLVM pre-built release archive
          case "${{ matrix.target }}" in
            linux-x64)    ARCHIVE="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz" ; EXT="" ;;
            darwin-arm64) ARCHIVE="LLVM-${LLVM_VERSION}-macOS-ARM64.tar.xz" ; EXT="" ;;
            win-x64)      ARCHIVE="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz" ; EXT=".exe" ;;
            win-arm64)    ARCHIVE="clang+llvm-${LLVM_VERSION}-aarch64-pc-windows-msvc.tar.xz" ; EXT=".exe" ;;
          esac

          echo "Downloading ${ARCHIVE}..."
          curl -L -o llvm-prebuilt.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/${ARCHIVE}"

          echo "Extracting..."
          tar xf llvm-prebuilt.tar.xz
          LLVM_DIR=$(ls -d */ | head -1)
          echo "Extracted to ${LLVM_DIR}"

          # Copy clang + lld binaries (dereference symlinks with -L)
          mkdir -p pkg/llvm-tools/bin
          cp -L "${LLVM_DIR}bin/clang${EXT}" pkg/llvm-tools/bin/

          # lld may be named ld.lld or lld — handle both
          if [ -f "${LLVM_DIR}bin/ld.lld${EXT}" ]; then
            cp -L "${LLVM_DIR}bin/ld.lld${EXT}" pkg/llvm-tools/bin/
          elif [ -f "${LLVM_DIR}bin/lld${EXT}" ]; then
            cp -L "${LLVM_DIR}bin/lld${EXT}" pkg/llvm-tools/bin/ld.lld${EXT}
          fi

          # Copy freestanding headers
          CLANG_INCLUDE=$(find "${LLVM_DIR}" -path "*/lib/clang/*/include" -type d | head -1)
          if [ -n "$CLANG_INCLUDE" ]; then
            CLANG_VER=$(basename "$(dirname "$CLANG_INCLUDE")")
            mkdir -p "pkg/llvm-tools/lib/clang/$CLANG_VER"
            cp -r "$CLANG_INCLUDE" "pkg/llvm-tools/lib/clang/$CLANG_VER/"
          fi

          # Strip binaries when possible (only native linux-x64)
          if [ "${{ matrix.target }}" = "linux-x64" ]; then
            strip pkg/llvm-tools/bin/clang pkg/llvm-tools/bin/ld.lld 2>/dev/null || true
          fi

          # Free disk space before packaging
          rm -rf "${LLVM_DIR}" llvm-prebuilt.tar.xz

          # Verify
          ls -la pkg/llvm-tools/bin/
          find pkg/llvm-tools/lib -type f | head -20 || true

          # Stamp the bundle so ToolResolver can compare against system tools
          echo "${LLVM_VERSION}" > pkg/llvm-tools/VERSION

      # The upstream Linux ld.lld is linked against libxml2.so.2 and looks for
      # it in ../lib first (its RUNPATH is $ORIGIN/../lib). A distribution on
      # libxml2 2.14 or later ships libxml2.so.16 only, and the linker does not
      # start there (#3245). The bundle therefore carries its own copy, built
      # from source with every optional dependency off, so that it needs
      # nothing but the C library.
      - name: Bundle libxml2 beside ld.lld (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          curl -fL -o libxml2.tar.xz \
            "https://download.gnome.org/sources/libxml2/${LIBXML2_VERSION%.*}/libxml2-${LIBXML2_VERSION}.tar.xz"
          echo "${LIBXML2_SHA256}  libxml2.tar.xz" | sha256sum -c -
          mkdir libxml2 && tar xf libxml2.tar.xz -C libxml2 --strip-components=1

          cd libxml2
          ./configure --disable-static --without-python --without-zlib --without-lzma \
            --without-icu --without-iconv --without-http --without-modules \
            --without-debug --without-readline --without-history
          make -j"$(nproc)" libxml2.la
          cd ..

          # One regular file under the name the linker asks for, no symlink chain
          cp -L libxml2/.libs/libxml2.so.2 pkg/llvm-tools/lib/libxml2.so.2
          strip pkg/llvm-tools/lib/libxml2.so.2
          cp libxml2/Copyright pkg/llvm-tools/lib/libxml2.so.2.LICENSE
          ls -la pkg/llvm-tools/lib/

      - name: Package
        run: |
          case "${{ matrix.target }}" in
            win-*) cd pkg && zip -r ../llvm-tools-${LLVM_VERSION}-${{ matrix.target }}.zip llvm-tools ;;
            *)     tar czf llvm-tools-${LLVM_VERSION}-${{ matrix.target }}.tar.gz -C pkg llvm-tools ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-tools-${{ matrix.target }}
          path: llvm-tools-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  xorriso — build from GNU source tarball
  #  Linux job also cross-compiles for Windows using mingw-w64
  # ═══════════════════════════════════════════════════════════════════════
  build-xorriso:
    name: xorriso ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Linux only (see the matrix): macOS and Windows build on the runner itself
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            container: ubuntu:22.04
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
    steps:
      # The image is bare. zlib is the one optional library xorriso was built
      # with on the runner, and every Ubuntu has it installed.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl zlib1g-dev

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make gcc pkg-config libiconv-devel

      - name: Download xorriso source (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fL -o xorriso.tar.gz \
            "https://ftp.gnu.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz" \
          || curl -fL -o xorriso.tar.gz \
            "https://mirrors.kernel.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz"
          tar xzf xorriso.tar.gz

      - name: Download xorriso source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -fL -o xorriso.tar.gz \
            "https://ftp.gnu.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz" \
          || curl -fL -o xorriso.tar.gz \
            "https://mirrors.kernel.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz"
          tar xzf xorriso.tar.gz

      - name: Build xorriso (Unix)
        if: runner.os != 'Windows'
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cd xorriso-${{ env.XORRISO_DIR }}
          ./configure --disable-libreadline --disable-libacl --disable-xattr
          make -j$NPROC
          strip xorriso/xorriso

      - name: Build xorriso (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd xorriso-${{ env.XORRISO_DIR }}
          ./configure --disable-libreadline --disable-libacl --disable-xattr
          make -j$(nproc)
          # Strip the real binary (not the libtool wrapper stub)
          strip xorriso/.libs/xorriso.exe 2>/dev/null || strip xorriso/xorriso.exe

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/xorriso
          cp xorriso-${{ env.XORRISO_DIR }}/xorriso/xorriso pkg/xorriso/
          echo "${{ env.XORRISO_VERSION }}" > pkg/xorriso/VERSION
          tar czf xorriso-${{ env.XORRISO_VERSION }}-${{ matrix.target }}.tar.gz -C pkg xorriso

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/xorriso
          # Copy the real binary from .libs/ (not the libtool wrapper stub)
          $realBinary = "xorriso-${{ env.XORRISO_DIR }}/xorriso/.libs/xorriso.exe"
          $wrapper = "xorriso-${{ env.XORRISO_DIR }}/xorriso/xorriso.exe"
          if (Test-Path $realBinary) {
            Copy-Item $realBinary pkg/xorriso/
          } else {
            Copy-Item $wrapper pkg/xorriso/
          }
          # Bundle MSYS2 runtime DLLs needed by xorriso
          $msysRoot = "C:\msys64\usr\bin"
          Copy-Item "$msysRoot\msys-2.0.dll" pkg/xorriso/
          Copy-Item "$msysRoot\msys-intl-8.dll" pkg/xorriso/
          Copy-Item "$msysRoot\msys-iconv-2.dll" pkg/xorriso/
          Set-Content -Path pkg/xorriso/VERSION -Value "${{ env.XORRISO_VERSION }}"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg/xorriso -DestinationPath xorriso-${{ env.XORRISO_VERSION }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xorriso-${{ matrix.target }}
          path: xorriso-${{ env.XORRISO_VERSION }}-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  QEMU — system emulators for x64 and ARM64
  #  Builds from source with minimal dependencies (headless, no GUI)
  #  Includes edk2 UEFI firmware for ARM64
  # ═══════════════════════════════════════════════════════════════════════
  build-qemu:
    name: QEMU ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Linux only (see the matrix): macOS and Windows build on the runner itself
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            container: ubuntu:22.04
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
            msystem: UCRT64
            mingw: mingw-w64-ucrt-x86_64
            cc: gcc
          # Windows on ARM: an ARM64 runner and CLANGARM64, the one MSYS2
          # environment with ARM64 packages. Its compiler is clang.
          - os: windows-11-arm
            target: win-arm64
            msystem: CLANGARM64
            mingw: mingw-w64-clang-aarch64
            cc: clang
    steps:
      # The image is bare: everything the build uses is named here. The second
      # group is what SDL can drive (X11, Wayland, the sound servers). It is
      # needed to build SDL and is not linked into anything: see Build SDL2.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl xz-utils bzip2 pkg-config \
            python3 python3-venv python3-tomli ninja-build \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev libzstd-dev
          apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libegl-dev libgles-dev libgl-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev

      # Ubuntu's SDL is linked against the whole desktop (X11, Wayland,
      # PulseAudio and what they pull in): some fifty libraries the package
      # then has to carry, in this image's versions, ahead of those of the
      # machine QEMU runs on. Built from source, SDL loads them from that
      # machine instead, and only once a window or a sound device is opened.
      # The library itself needs the C library and nothing else.
      - name: Build SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fL -o sdl2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          echo "${SDL2_SHA256}  sdl2.tar.gz" | sha256sum -c -
          tar xzf sdl2.tar.gz
          cd "SDL2-${SDL2_VERSION}"
          ./configure --disable-static
          make -j"$(nproc)"
          make install
          ldconfig

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glib pixman ninja python pkg-config libslirp sdl2 dtc

      # UCRT64 is the environment MSYS2 builds for on x64: MINGW64 is deprecated
      # and has started to lose packages (libslirp is gone from it). The
      # matrix names the environment, its package prefix and its compiler.
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.mingw }}-${{ matrix.cc }}
            ${{ matrix.mingw }}-glib2
            ${{ matrix.mingw }}-pixman
            ${{ matrix.mingw }}-libslirp
            ${{ matrix.mingw }}-ninja
            ${{ matrix.mingw }}-python
            ${{ matrix.mingw }}-pkgconf
            ${{ matrix.mingw }}-meson
            ${{ matrix.mingw }}-SDL2
            ${{ matrix.mingw }}-dtc
            make flex bison diffutils git

      - name: Download QEMU source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -L -o qemu.tar.xz \
            "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
          tar xf qemu.tar.xz 2>/dev/null || true

      - name: Download QEMU source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -L -o qemu.tar.xz \
            "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
          tar xf qemu.tar.xz 2>/dev/null || true

      - name: Download UEFI firmware
        shell: bash
        run: |
          mkdir -p firmware
          curl -L -o firmware/edk2-aarch64-code.fd.bz2 \
            "https://github.com/qemu/qemu/raw/v${{ env.QEMU_VERSION }}/pc-bios/edk2-aarch64-code.fd.bz2"
          bunzip2 firmware/edk2-aarch64-code.fd.bz2

      - name: Build QEMU (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          PLATFORM_FLAGS=()
          if [ "$(uname)" = "Linux" ]; then
            # Sound goes through SDL, like the window: QEMU's own ALSA,
            # PulseAudio and PipeWire drivers would link those libraries into
            # it. gio only serves the D-Bus display and audio, unused here,
            # and brings GObject, libmount and SELinux with it.
            PLATFORM_FLAGS=(--audio-drv-list=sdl --disable-alsa --disable-pa --disable-pipewire --disable-gio)
          fi
          cd qemu-${{ env.QEMU_VERSION }}
          ./configure \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --enable-slirp \
            --enable-sdl \
            --disable-docs \
            "${PLATFORM_FLAGS[@]}"
          # Build only the binaries we need (skip tests — broken on Windows mingw)
          ninja -C build -j$NPROC qemu-system-x86_64 qemu-system-aarch64 qemu-img

      - name: Build QEMU (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          PLATFORM_FLAGS=()
          if [ "${{ matrix.target }}" = "win-arm64" ]; then
            # The guest agent, which this job never builds, makes configure
            # look for windmc, and LLVM has no such tool.
            PLATFORM_FLAGS=(--disable-guest-agent)
          fi
          cd qemu-${{ env.QEMU_VERSION }}
          ./configure \
            --target-list=x86_64-softmmu,aarch64-softmmu \
            --enable-slirp \
            --enable-sdl \
            --disable-docs \
            "${PLATFORM_FLAGS[@]}"
          # Build only the binaries we need (skip tests — broken on Windows mingw)
          ninja -C build -j$(nproc) qemu-system-x86_64.exe qemu-system-aarch64.exe qemu-img.exe

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BUILD_DIR="qemu-${{ env.QEMU_VERSION }}/build"
          mkdir -p pkg/qemu/share/qemu
          # Find binaries — macOS uses *-unsigned suffix (code signing)
          for bin in qemu-system-x86_64 qemu-system-aarch64 qemu-img; do
            SRC=$(find "$BUILD_DIR" -maxdepth 2 \( -name "$bin" -o -name "${bin}-unsigned" \) -type f | head -1)
            if [ -n "$SRC" ]; then
              cp "$SRC" "pkg/qemu/$bin"
            fi
          done
          strip pkg/qemu/qemu-system-* pkg/qemu/qemu-img 2>/dev/null || true
          # Verify binaries exist
          ls -la pkg/qemu/qemu-system-*

          # Bundle shared libraries so QEMU runs without system deps
          mkdir -p pkg/qemu/lib
          collect_deps() {
            local binary="$1"
            if [ "${{ runner.os }}" = "Linux" ]; then
              ldd "$binary" 2>/dev/null | grep "=> /" | awk '{print $3}' || true
            else
              otool -L "$binary" 2>/dev/null | awk '/\/opt\/homebrew|\/usr\/local/{print $1}' || true
            fi
          }
          SKIP_LIBS="libc.so|libm.so|libdl.so|libpthread.so|librt.so|ld-linux|libSystem.B"
          copy_deps() {
            local binary="$1"
            collect_deps "$binary" | while read -r lib; do
              if ! echo "$lib" | grep -qE "$SKIP_LIBS"; then
                cp -n "$lib" pkg/qemu/lib/ 2>/dev/null || true
              fi
            done || true
          }
          # Pass 1: direct deps of QEMU binaries
          for bin in pkg/qemu/qemu-system-x86_64 pkg/qemu/qemu-system-aarch64 pkg/qemu/qemu-img; do
            [ -f "$bin" ] || continue
            copy_deps "$bin"
          done
          # Pass 2: transitive deps of bundled libs
          for lib in pkg/qemu/lib/*; do
            [ -f "$lib" ] || continue
            copy_deps "$lib"
          done
          echo "Bundled shared libraries:"
          ls -la pkg/qemu/lib/ || echo "(no libraries bundled)"

          # Create wrapper scripts that set library path
          if [ "${{ runner.os }}" = "Linux" ]; then
            LIB_VAR="LD_LIBRARY_PATH"
          else
            LIB_VAR="DYLD_LIBRARY_PATH"
          fi
          for bin in qemu-system-x86_64 qemu-system-aarch64 qemu-img; do
            [ -f "pkg/qemu/$bin" ] || continue
            mv "pkg/qemu/$bin" "pkg/qemu/$bin.real"
            {
              echo '#!/bin/sh'
              echo 'DIR="$(cd "$(dirname "$0")" && pwd)"'
              echo "export ${LIB_VAR}=\"\$DIR/lib\${${LIB_VAR}:+:\$${LIB_VAR}}\""
              # QEMU ignores QEMU_DATADIR; it searches exec_dir/../share/qemu.
              # Our layout keeps share/qemu as a sibling of the binary, so pass -L explicitly.
              # qemu-img loads no firmware and refuses the option.
              if [ "$bin" = "qemu-img" ]; then
                echo 'exec "$DIR/$(basename "$0").real" "$@"'
              else
                echo 'exec "$DIR/$(basename "$0").real" -L "$DIR/share/qemu" "$@"'
              fi
            } > "pkg/qemu/$bin"
            chmod +x "pkg/qemu/$bin"
          done

          # Copy firmware files from build dir (directories) and source tree (BIOS binaries)
          cp -r "$BUILD_DIR"/pc-bios/* pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.bin pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.rom pkg/qemu/share/qemu/ 2>/dev/null || true
          cp firmware/edk2-aarch64-code.fd pkg/qemu/share/qemu/
          echo "=== Firmware files packaged ==="
          ls pkg/qemu/share/qemu/*.bin pkg/qemu/share/qemu/*.fd 2>/dev/null || echo "WARNING: no firmware files found"
          # Stamp the bundle with its version (see Windows packaging step for rationale)
          echo "${{ env.QEMU_VERSION }}" > pkg/qemu/VERSION
          tar czf qemu-${{ env.QEMU_VERSION }}-${{ matrix.target }}.tar.gz -C pkg qemu

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          BUILD_DIR="qemu-${{ env.QEMU_VERSION }}/build"
          # Universal layout (matches Linux/macOS):
          #   qemu/bin/         exes + transitive DLLs
          #   qemu/share/qemu/  BIOS, ROMs, edk2 firmware
          # QEMU on the MSYS2/MinGW Windows build does not auto-discover its
          # data dir, so launchers (cosmos run, test runner, VS Code extension)
          # always pass -L "<exe_dir>/../share/qemu" — single rule, no OS branch.
          mkdir -p pkg/qemu/bin pkg/qemu/share/qemu
          find "$BUILD_DIR" -maxdepth 2 -name 'qemu-system-x86_64.exe' -type f | head -1 | xargs -I{} cp {} pkg/qemu/bin/
          find "$BUILD_DIR" -maxdepth 2 -name 'qemu-system-aarch64.exe' -type f | head -1 | xargs -I{} cp {} pkg/qemu/bin/
          find "$BUILD_DIR" -maxdepth 2 -name 'qemu-img.exe' -type f | head -1 | xargs -I{} cp {} pkg/qemu/bin/ 2>/dev/null || true
          strip pkg/qemu/bin/*.exe 2>/dev/null || true
          ls -la pkg/qemu/bin/qemu-system-*
          # Copy BIOS/firmware files
          cp -r "$BUILD_DIR"/pc-bios/* pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.bin pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.rom pkg/qemu/share/qemu/ 2>/dev/null || true
          cp firmware/edk2-aarch64-code.fd pkg/qemu/share/qemu/
          # Bundle the MSYS2 runtime DLLs by walking PE imports transitively.
          # objdump -p lists each DLL imported by a binary; we recurse so deps
          # of deps (e.g. libgio -> libgmodule -> libffi) are captured. Anything
          # that doesn't resolve under the environment's bin directory is
          # assumed to be a Windows system DLL (kernel32, ole32, api-ms-win-*)
          # and skipped. DLLs land in pkg/qemu/bin/ alongside the exes so
          # Windows' loader finds them.
          MINGW_BIN="${MINGW_PREFIX}/bin"
          declare -A seen
          queue=()
          for exe in pkg/qemu/bin/qemu-system-x86_64.exe pkg/qemu/bin/qemu-system-aarch64.exe pkg/qemu/bin/qemu-img.exe; do
            [ -f "$exe" ] && queue+=("$exe")
          done
          while [ ${#queue[@]} -gt 0 ]; do
            cur="${queue[0]}"
            queue=("${queue[@]:1}")
            base_lc=$(basename "$cur" | tr '[:upper:]' '[:lower:]')
            [ -n "${seen[$base_lc]:-}" ] && continue
            seen[$base_lc]=1
            while IFS= read -r dll; do
              dll_lc=$(echo "$dll" | tr '[:upper:]' '[:lower:]')
              [ -n "${seen[$dll_lc]:-}" ] && continue
              src="$MINGW_BIN/$dll"
              if [ -f "$src" ]; then
                dest="pkg/qemu/bin/$dll"
                [ -f "$dest" ] || cp "$src" "$dest"
                queue+=("$dest")
              fi
            done < <(objdump -p "$cur" 2>/dev/null | awk '/DLL Name:/ {print $3}')
          done
          # Stamp the bundle with its version so the resolver can compare
          # against system-installed QEMU and accept it when versions match.
          echo "${{ env.QEMU_VERSION }}" > pkg/qemu/VERSION
          echo "=== Bundled DLLs ==="
          ls pkg/qemu/bin/*.dll

      # Runs in pwsh, NOT the msys2 shell: the MSYS2 directories are absent
      # from PATH here, so a DLL the bundle lacks stops the job.
      - name: Smoke test bundled QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($exe in 'qemu-system-x86_64', 'qemu-system-aarch64', 'qemu-img') {
            & "pkg\qemu\bin\$exe.exe" --version
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg/qemu -DestinationPath qemu-${{ env.QEMU_VERSION }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.target }}
          path: qemu-${{ env.QEMU_VERSION }}-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  GDB — multiarch debugger built from sourceware tarball
  #  Single binary `gdb-multiarch` configured with --enable-targets=all so
  #  the same binary can debug x64 and ARM64 kernels via QEMU's gdbstub.
  # ═══════════════════════════════════════════════════════════════════════
  build-gdb:
    name: GDB ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Linux only (see the matrix): macOS and Windows build on the runner itself
    container: ${{ matrix.container }}
    env:
      # Linux: where gdb is configured to live and where its Python is unpacked
      GDB_PREFIX: /opt/gdb
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            container: ubuntu:22.04
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
            msystem: UCRT64
            mingw: mingw-w64-ucrt-x86_64
            cc: gcc
          # Windows on ARM: an ARM64 runner and CLANGARM64, the one MSYS2
          # environment with ARM64 packages. Its compiler is clang.
          - os: windows-11-arm
            target: win-arm64
            msystem: CLANGARM64
            mingw: mingw-w64-clang-aarch64
            cc: clang
    steps:
      # The image is bare: everything the build uses is named here.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl xz-utils texinfo pkg-config patchelf \
            libgmp-dev libmpfr-dev libexpat1-dev libzstd-dev libncurses-dev

      # gdb embeds CPython, and a gdb linked against the distribution's
      # libpython starts on that one release: 3.10, 3.12 and 3.14 on the last
      # three LTS. The Linux package carries its own instead, as the macOS and
      # Windows ones do: a standalone build that needs the C library alone,
      # unpacked under the prefix gdb is configured with, so that gdb finds the
      # standard library from its own location wherever the package lands.
      - name: Install the Python gdb embeds (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fL -o python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_STANDALONE_RELEASE}/cpython-${PYTHON_STANDALONE_VERSION}+${PYTHON_STANDALONE_RELEASE}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          echo "${PYTHON_STANDALONE_SHA256}  python.tar.gz" | sha256sum -c -
          mkdir -p "${GDB_PREFIX}"
          tar xzf python.tar.gz -C "${GDB_PREFIX}" --strip-components=1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr expat libxml2 texinfo python@${PYTHON_VERSION}

      # The environment the matrix names, as for QEMU.
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.mingw }}-${{ matrix.cc }}
            ${{ matrix.mingw }}-gmp
            ${{ matrix.mingw }}-mpfr
            ${{ matrix.mingw }}-expat
            ${{ matrix.mingw }}-libxml2
            ${{ matrix.mingw }}-pkgconf
            ${{ matrix.mingw }}-python
            make texinfo bison flex

      - name: Download GDB source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -L -o gdb.tar.xz \
            "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          tar xf gdb.tar.xz

      - name: Download GDB source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -L -o gdb.tar.xz \
            "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          tar xf gdb.tar.xz

      # Configure flags rationale:
      #   --enable-targets=all       gdb-multiarch can debug x86, x86_64, arm, aarch64 from one binary
      #   --disable-werror           newer compilers warn on legacy gdb code
      #   --disable-source-highlight drops libsource-highlight runtime dep
      #   --disable-tui              skips ncurses TUI (we drive gdb via cppdbg/MI, not interactive)
      #   --disable-nls              no translations
      #   --with-python=<interp>     embed CPython — gdb scripting (pretty-printers,
      #                              kernel debug helpers) needs it. Must point at an
      #                              interpreter with dev files: the runner's default
      #                              python fails configure's link test on macOS and
      #                              doesn't exist in MSYS2. The python runtime is
      #                              bundled into the artifact at packaging.
      #   --without-guile            no Guile scripting
      # libxml2 is left enabled — QEMU's gdbstub sends XML target descriptions.
      - name: Build GDB (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          PLATFORM_FLAGS=()
          # Apple Silicon brew lives at /opt/homebrew, not on the default
          # compiler search path — configure won't find gmp/mpfr/expat
          # headers without the explicit -I/-L. Linux apt installs to
          # /usr/include and /usr/lib so this is a no-op there.
          if [ "$(uname)" = "Darwin" ]; then
            BREW_PREFIX=$(brew --prefix)
            export CPPFLAGS="-I${BREW_PREFIX}/include ${CPPFLAGS:-}"
            export LDFLAGS="-L${BREW_PREFIX}/lib ${LDFLAGS:-}"
            # The python.org framework python preinstalled on the runner
            # fails configure's libpython link test; use brew's.
            PYTHON_BIN="$(brew --prefix python@${PYTHON_VERSION})/bin/python${PYTHON_VERSION}"
          else
            # The standalone CPython, under gdb's own prefix. The C++ runtime
            # is linked in, so that the package does not have to carry it.
            PYTHON_BIN="${GDB_PREFIX}/bin/python3"
            export LDFLAGS="-L${GDB_PREFIX}/lib"
            PLATFORM_FLAGS=(--prefix="${GDB_PREFIX}" --with-static-standard-libraries)
          fi
          cd gdb-${GDB_VERSION}
          # --target=x86_64-pc-linux-gnu builds gdb as a cross-debugger.
          # Required on macOS aarch64 because upstream has no native
          # debugging backend for that host — without --target, configure
          # auto-excludes the gdb subdir entirely ("This configuration is
          # not supported in the following subdirectories: gdb"). Cosmos
          # kernels are linux-<arch> ELF and we always debug remotely via
          # QEMU's gdbstub, so a cross-debugger is what we want anyway;
          # --enable-targets=all keeps multiarch support at runtime.
          # --disable-{binutils,gas,ld,gprof,gprofng}: skip binutils sister
          # components, build only gdb + its support libs.
          ./configure \
            --target=x86_64-pc-linux-gnu \
            --enable-targets=all \
            --disable-werror \
            --disable-source-highlight \
            --disable-tui \
            --disable-nls \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gprof \
            --disable-gprofng \
            --disable-sim \
            --disable-gdbserver \
            --with-python="${PYTHON_BIN}" \
            --without-guile \
            "${PLATFORM_FLAGS[@]}"
          make -j$NPROC
          strip gdb/gdb gdb/gdb-unsigned 2>/dev/null || true

      - name: Build GDB (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd gdb-${GDB_VERSION}
          PLATFORM_FLAGS=()
          if [ "${{ matrix.target }}" = "win-arm64" ]; then
            # GDB learns the Windows on ARM host in 18.1. Before that it takes
            # its POSIX host code there, whose event loop is a plain select(),
            # which Windows offers for sockets only. This is the entry 18.1
            # adds to configure.host; it goes away with a move to GDB 18.
            sed -i '/^aarch64\*-\*-freebsd\*)/a aarch64*-*-mingw*)\tgdb_host=mingw64a\n\t\t\tgdb_host_obs=mingw-hdep.o\n\t\t\t;;' gdb/configure.host
            grep -q '^aarch64\*-\*-mingw\*)' gdb/configure.host
            # The host is named: config.guess would run in MSYS2's own shell,
            # which is an x64 program on this runner too.
            PLATFORM_FLAGS=(--build=aarch64-w64-mingw32 --host=aarch64-w64-mingw32)
          fi
          # See Linux/macOS step: --target=x86_64-pc-linux-gnu makes gdb
          # a cross-debugger (so configure doesn't try native Windows
          # debugging, which has its own complications); --enable-targets=all
          # keeps multiarch support.
          ./configure \
            --target=x86_64-pc-linux-gnu \
            --enable-targets=all \
            --disable-werror \
            --disable-source-highlight \
            --disable-tui \
            --disable-nls \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gprof \
            --disable-gprofng \
            --disable-sim \
            --disable-gdbserver \
            --with-python="${MINGW_PREFIX}/bin/python3" \
            --without-guile \
            "${PLATFORM_FLAGS[@]}"
          make -j$(nproc)
          strip gdb/gdb.exe

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Layout matches QEMU bundle: gdb/bin/<exe> so the resolver finds it
          # under the same `<asset>/bin/<cmd>` rule it uses for llvm-tools.
          mkdir -p pkg/gdb/bin
          # macOS produces `gdb-unsigned` (codesign is a separate post-build
          # step); Linux produces `gdb`. Pick whichever exists.
          SRC=$(find "gdb-${GDB_VERSION}/gdb" -maxdepth 1 \( -name 'gdb' -o -name 'gdb-unsigned' \) -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: built gdb binary not found under gdb-${GDB_VERSION}/gdb/" >&2
            ls -la "gdb-${GDB_VERSION}/gdb/" >&2
            exit 1
          fi
          cp "$SRC" pkg/gdb/bin/gdb-multiarch
          chmod +x pkg/gdb/bin/gdb-multiarch
          # gdb's data directory (python `gdb` module, syscall XMLs). gdb
          # relocates it relative to its own binary, so <pkg>/bin/gdb-multiarch
          # looks it up at <pkg>/share/gdb.
          mkdir -p pkg/gdb/share/gdb
          for d in python syscalls system-gdbinit; do
            if [ -d "gdb-${GDB_VERSION}/gdb/data-directory/$d" ]; then
              cp -R "gdb-${GDB_VERSION}/gdb/data-directory/$d" pkg/gdb/share/gdb/
            fi
          done
          # The parts of the standard library a debugger has no use for
          trim_python_stdlib() {
            rm -rf "pkg/gdb/lib/python${PYTHON_VERSION}/test" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/idlelib" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/tkinter" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/turtledemo" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/ensurepip" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/site-packages"
            find pkg/gdb/lib -name __pycache__ -type d -prune -exec rm -rf {} +
          }
          if [ "$(uname)" = "Linux" ]; then
            # The Python runtime gdb is linked against and its standard
            # library, then every other library gdb needs, the C library
            # excepted. gdb looks for them in ../lib, and finds the standard
            # library there by itself (it sits under the prefix it was
            # configured with).
            mkdir -p pkg/gdb/lib
            cp -L "${GDB_PREFIX}/lib/libpython${PYTHON_VERSION}.so.1.0" pkg/gdb/lib/
            cp -R "${GDB_PREFIX}/lib/python${PYTHON_VERSION}" pkg/gdb/lib/
            # Also out: what serves to build extension modules, and the Tk
            # binding, whose libraries the package does not carry.
            rm -rf "pkg/gdb/lib/python${PYTHON_VERSION}"/config-* \
                   "pkg/gdb/lib/python${PYTHON_VERSION}"/lib-dynload/_tkinter*
            trim_python_stdlib
            patchelf --set-rpath '$ORIGIN/../lib' pkg/gdb/bin/gdb-multiarch
            ldd pkg/gdb/bin/gdb-multiarch | awk '/=> \//{print $3}' | while read -r lib; do
              case "$(basename "$lib")" in
                libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libutil.so.*) ;;
                *) [ -e "pkg/gdb/lib/$(basename "$lib")" ] || cp -L "$lib" pkg/gdb/lib/ ;;
              esac
            done
            ls -la pkg/gdb/lib/
          fi
          if [ "$(uname)" = "Darwin" ]; then
            # Bundle the brew CPython runtime so the artifact runs on machines
            # without Homebrew: relink gdb against a copied libpython, ship the
            # stdlib, and set PYTHONHOME through a wrapper script (embedded
            # CPython cannot find its stdlib once the build prefix is gone).
            PYPREFIX="$(brew --prefix python@${PYTHON_VERSION})/Frameworks/Python.framework/Versions/${PYTHON_VERSION}"
            mkdir -p pkg/gdb/lib
            mv pkg/gdb/bin/gdb-multiarch pkg/gdb/bin/gdb-multiarch-bin
            DYLIB=$(otool -L pkg/gdb/bin/gdb-multiarch-bin | awk '/Python.framework|libpython/ {print $1; exit}')
            if [ -z "$DYLIB" ]; then
              echo "ERROR: gdb is not linked against libpython" >&2
              otool -L pkg/gdb/bin/gdb-multiarch-bin >&2
              exit 1
            fi
            cp "$DYLIB" "pkg/gdb/lib/libpython${PYTHON_VERSION}.dylib"
            chmod u+w "pkg/gdb/lib/libpython${PYTHON_VERSION}.dylib"
            install_name_tool -change "$DYLIB" \
              "@executable_path/../lib/libpython${PYTHON_VERSION}.dylib" \
              pkg/gdb/bin/gdb-multiarch-bin
            # install_name_tool invalidates the ad-hoc signature; arm64
            # macOS refuses to run unsigned binaries, so re-sign.
            codesign --force -s - "pkg/gdb/lib/libpython${PYTHON_VERSION}.dylib" pkg/gdb/bin/gdb-multiarch-bin
            cp -R "${PYPREFIX}/lib/python${PYTHON_VERSION}" pkg/gdb/lib/
            trim_python_stdlib
            printf '%s\n' \
              '#!/bin/sh' \
              'here="$(cd "$(dirname "$0")" && pwd)"' \
              'export PYTHONHOME="${here%/bin}"' \
              'exec "$here/gdb-multiarch-bin" "$@"' \
              > pkg/gdb/bin/gdb-multiarch
            chmod +x pkg/gdb/bin/gdb-multiarch
          fi
          # Smoke test: the packaged gdb must start and its embedded python
          # must reach a working stdlib.
          ./pkg/gdb/bin/gdb-multiarch --batch \
            -ex 'python import sys; print("PYTHON_OK", sys.version)' \
            -ex 'show data-directory' | tee smoke.log
          grep -q PYTHON_OK smoke.log
          echo "${GDB_VERSION}" > pkg/gdb/VERSION
          tar czf gdb-${GDB_VERSION}-${{ matrix.target }}.tar.gz -C pkg gdb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p pkg/gdb/bin
          # Locate the built binary — the cross-target build can land it
          # under .libs/ (libtool) or the gdb/ root. List candidates first
          # so any path drift surfaces clearly in the log.
          echo "=== Candidate gdb binaries in build dir ==="
          find "gdb-${GDB_VERSION}/gdb" -maxdepth 2 -name 'gdb*.exe' -type f 2>/dev/null
          SRC=$(find "gdb-${GDB_VERSION}/gdb" -maxdepth 2 -name 'gdb.exe' -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: built gdb.exe not found" >&2
            exit 1
          fi
          cp "$SRC" pkg/gdb/bin/gdb-multiarch.exe
          echo "=== Packaged binary ==="
          ls -la pkg/gdb/bin/
          # Walk PE imports to bundle the MSYS2 DLLs (same recursive pattern as
          # the QEMU bundle). Anything not under its bin directory is a Windows
          # system DLL (kernel32, ws2_32, …) and is skipped.
          MINGW_BIN="${MINGW_PREFIX}/bin"
          declare -A seen
          queue=("pkg/gdb/bin/gdb-multiarch.exe")
          while [ ${#queue[@]} -gt 0 ]; do
            cur="${queue[0]}"
            queue=("${queue[@]:1}")
            base_lc=$(basename "$cur" | tr '[:upper:]' '[:lower:]')
            [ -n "${seen[$base_lc]:-}" ] && continue
            seen[$base_lc]=1
            while IFS= read -r dll; do
              dll_lc=$(echo "$dll" | tr '[:upper:]' '[:lower:]')
              [ -n "${seen[$dll_lc]:-}" ] && continue
              src="$MINGW_BIN/$dll"
              if [ -f "$src" ]; then
                dest="pkg/gdb/bin/$dll"
                [ -f "$dest" ] || cp "$src" "$dest"
                queue+=("$dest")
              fi
            done < <(objdump -p "$cur" 2>/dev/null | awk '/DLL Name:/ {print $3}')
          done
          # Python stdlib — embedded CPython locates it relative to the
          # libpython3.x.dll bundled in bin/ (../lib/python3.x).
          PYVER=$("${MINGW_PREFIX}/bin/python3" -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          mkdir -p pkg/gdb/lib
          cp -R "${MINGW_PREFIX}/lib/python${PYVER}" pkg/gdb/lib/
          rm -rf "pkg/gdb/lib/python${PYVER}/test" \
                 "pkg/gdb/lib/python${PYVER}/idlelib" \
                 "pkg/gdb/lib/python${PYVER}/tkinter" \
                 "pkg/gdb/lib/python${PYVER}/turtledemo" \
                 "pkg/gdb/lib/python${PYVER}/ensurepip" \
                 "pkg/gdb/lib/python${PYVER}/site-packages"
          find pkg/gdb/lib -name __pycache__ -type d -prune -exec rm -rf {} +
          # gdb's data directory (python `gdb` module, syscall XMLs),
          # relocated by gdb relative to its own binary.
          mkdir -p pkg/gdb/share/gdb
          for d in python syscalls system-gdbinit; do
            if [ -d "gdb-${GDB_VERSION}/gdb/data-directory/$d" ]; then
              cp -R "gdb-${GDB_VERSION}/gdb/data-directory/$d" pkg/gdb/share/gdb/
            fi
          done
          echo "${GDB_VERSION}" > pkg/gdb/VERSION
          echo "=== Bundled DLLs ==="
          ls pkg/gdb/bin/*.dll || echo "(no DLLs bundled — gdb-multiarch.exe must be statically linked)"

      # Runs in pwsh, NOT the msys2 shell: /ucrt64 is absent from PATH here,
      # so this proves the bundle is self-contained (DLLs + python stdlib).
      - name: Smoke test bundled gdb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & pkg\gdb\bin\gdb-multiarch.exe --batch -ex 'python import sys; print("PYTHON_OK", sys.version)' -ex 'show data-directory' 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'PYTHON_OK') { exit 1 }

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg/gdb -DestinationPath gdb-${{ env.GDB_VERSION }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gdb-${{ matrix.target }}
          path: gdb-${{ env.GDB_VERSION }}-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  Verify (Linux): every packaged tool does its job on a bare image of
  #  each supported Ubuntu release
  # ═══════════════════════════════════════════════════════════════════════
  verify-linux:
    name: Verify on ${{ matrix.image }}
    needs:
      - build-llvm
      - build-xorriso
      - build-qemu
      - build-gdb
    # Whatever happened to the macOS and Windows builds: the Linux packages
    # are verified as soon as they exist.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Nothing is installed in these images: a tool that needs a library its
    # package does not bring fails here, before the release.
    container: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The LTS releases still supported, and the latest release, where the
        # next incompatibility shows first.
        image: [ "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "ubuntu:rolling" ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-linux-x64"
          path: artifacts
          merge-multiple: true

      - name: Unpack the tools
        run: |
          mkdir tools
          for archive in artifacts/*.tar.gz; do
            tar xzf "$archive" -C tools
          done
          ls tools

      - name: clang and ld.lld build a freestanding image for both architectures
        run: |
          printf '#include <stdint.h>\nuint64_t ticks;\nvoid _start(void) { for (;;) { ticks++; } }\n' > kernel.c
          for triple in x86_64-elf aarch64-none-elf; do
            tools/llvm-tools/bin/clang --target=$triple -ffreestanding -nostdlib -c kernel.c -o kernel-$triple.o
            tools/llvm-tools/bin/ld.lld -nostdlib -static -e _start kernel-$triple.o -o kernel-$triple.elf
          done

      - name: xorriso writes an ISO and reads it back
        run: |
          mkdir iso
          cp kernel-x86_64-elf.elf iso/kernel.elf
          tools/xorriso/xorriso -as mkisofs -o test.iso iso
          tools/xorriso/xorriso -indev test.iso -find / -name kernel.elf | grep kernel.elf

      # No display, as in the test runs. Each machine is built, loads its
      # firmware from the package and answers on its monitor.
      - name: QEMU creates both machines and a disk image
        run: |
          echo quit | tools/qemu/qemu-system-x86_64 -M q35 -cdrom test.iso -display none -monitor stdio
          echo quit | tools/qemu/qemu-system-aarch64 -M virt -cpu cortex-a72 -bios edk2-aarch64-code.fd -display none -monitor stdio
          tools/qemu/qemu-img create -f qcow2 disk.qcow2 16M
          tools/qemu/qemu-img info disk.qcow2

      - name: GDB runs its Python and reads both images
        run: |
          tools/gdb/bin/gdb-multiarch --batch -ex 'python import sys; print("PYTHON_OK", sys.version)' | tee python.log
          grep -q PYTHON_OK python.log
          for triple in x86_64-elf aarch64-none-elf; do
            tools/gdb/bin/gdb-multiarch --batch -ex 'info address _start' kernel-$triple.elf
          done

  # ═══════════════════════════════════════════════════════════════════════
  #  Release — collect all artifacts and create a GitHub release
  # ═══════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs:
      - build-llvm
      - build-xorriso
      - build-qemu
      - build-gdb
      - verify-linux
    # A pull request builds and verifies; only a manual run publishes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Delete previous release (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete tools-latest --yes --cleanup-tag --repo ${{ github.repository }} 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-latest
          name: "Cosmos Tools (LLVM ${{ env.LLVM_VERSION }}, QEMU ${{ env.QEMU_VERSION }}, xorriso ${{ env.XORRISO_VERSION }}, GDB ${{ env.GDB_VERSION }})"
          body: |
            Pre-built development tools for Cosmos kernel development.

            ## Versions
            | Tool | Version |
            |------|---------|
            | LLVM (Clang + LLD) | ${{ env.LLVM_VERSION }} |
            | xorriso | ${{ env.XORRISO_VERSION }} |
            | QEMU | ${{ env.QEMU_VERSION }} |
            | GDB (multiarch) | ${{ env.GDB_VERSION }} |

            ## Platforms
            - `linux-x64` — .tar.gz archives
            - `darwin-arm64` — .tar.gz archives
            - `win-x64` — .zip archives
            - `win-arm64` - .zip archives of LLVM, QEMU and GDB. xorriso has no ARM64 build: Windows on ARM runs the `win-x64` one.
          files: artifacts/*
          draft: false
          prerelease: false
