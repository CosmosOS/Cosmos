name: Build Tools

on:
  workflow_dispatch:

env:
  LLVM_VERSION: "22.1.3"
  LLVM_TAG: "llvmorg-22.1.3"
  XORRISO_VERSION: "1.5.8.pl01"
  XORRISO_DIR: "1.5.8"
  QEMU_VERSION: "10.2.2"
  GDB_VERSION: "17.1"
  # CPython embedded in gdb for scripting (pretty-printers, kernel debug
  # helpers). macOS bundling paths are keyed on this exact version.
  PYTHON_VERSION: "3.13"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  #  LLVM (Clang + LLD) — replaces GCC cross-compilers
  #  Clang handles both x64 and ARM64 via --target= flag
  # ═══════════════════════════════════════════════════════════════════════
  build-llvm:
    name: LLVM ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
          - target: darwin-arm64
          - target: win-x64
    steps:
      - name: Download & repackage LLVM
        shell: bash
        run: |
          # Map target to official LLVM pre-built release archive
          case "${{ matrix.target }}" in
            linux-x64)    ARCHIVE="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz" ; EXT="" ;;
            darwin-arm64) ARCHIVE="LLVM-${LLVM_VERSION}-macOS-ARM64.tar.xz" ; EXT="" ;;
            win-x64)      ARCHIVE="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz" ; EXT=".exe" ;;
          esac

          echo "Downloading ${ARCHIVE}..."
          curl -L -o llvm-prebuilt.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/${ARCHIVE}"

          echo "Extracting..."
          tar xf llvm-prebuilt.tar.xz
          LLVM_DIR=$(ls -d */ | head -1)
          echo "Extracted to ${LLVM_DIR}"

          # Copy clang + lld binaries (dereference symlinks with -L)
          mkdir -p pkg/llvm-tools/bin
          cp -L "${LLVM_DIR}bin/clang${EXT}" pkg/llvm-tools/bin/

          # lld may be named ld.lld or lld — handle both
          if [ -f "${LLVM_DIR}bin/ld.lld${EXT}" ]; then
            cp -L "${LLVM_DIR}bin/ld.lld${EXT}" pkg/llvm-tools/bin/
          elif [ -f "${LLVM_DIR}bin/lld${EXT}" ]; then
            cp -L "${LLVM_DIR}bin/lld${EXT}" pkg/llvm-tools/bin/ld.lld${EXT}
          fi

          # Copy freestanding headers
          CLANG_INCLUDE=$(find "${LLVM_DIR}" -path "*/lib/clang/*/include" -type d | head -1)
          if [ -n "$CLANG_INCLUDE" ]; then
            CLANG_VER=$(basename "$(dirname "$CLANG_INCLUDE")")
            mkdir -p "pkg/llvm-tools/lib/clang/$CLANG_VER"
            cp -r "$CLANG_INCLUDE" "pkg/llvm-tools/lib/clang/$CLANG_VER/"
          fi

          # Strip binaries when possible (only native linux-x64)
          if [ "${{ matrix.target }}" = "linux-x64" ]; then
            strip pkg/llvm-tools/bin/clang pkg/llvm-tools/bin/ld.lld 2>/dev/null || true
          fi

          # Free disk space before packaging
          rm -rf "${LLVM_DIR}" llvm-prebuilt.tar.xz

          # Verify
          ls -la pkg/llvm-tools/bin/
          find pkg/llvm-tools/lib -type f | head -20 || true

          # Stamp the bundle so ToolResolver can compare against system tools
          echo "${LLVM_VERSION}" > pkg/llvm-tools/VERSION

          # Package
          if [ "${{ matrix.target }}" = "win-x64" ]; then
            cd pkg && zip -r ../llvm-tools-${LLVM_VERSION}-${{ matrix.target }}.zip llvm-tools
          else
            tar czf llvm-tools-${LLVM_VERSION}-${{ matrix.target }}.tar.gz -C pkg llvm-tools
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-tools-${{ matrix.target }}
          path: llvm-tools-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  xorriso — build from GNU source tarball
  #  Linux job also cross-compiles for Windows using mingw-w64
  # ═══════════════════════════════════════════════════════════════════════
  build-xorriso:
    name: xorriso ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
    steps:
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make gcc pkg-config libiconv-devel

      - name: Download xorriso source (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fL -o xorriso.tar.gz \
            "https://ftp.gnu.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz" \
          || curl -fL -o xorriso.tar.gz \
            "https://mirrors.kernel.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz"
          tar xzf xorriso.tar.gz

      - name: Download xorriso source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -fL -o xorriso.tar.gz \
            "https://ftp.gnu.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz" \
          || curl -fL -o xorriso.tar.gz \
            "https://mirrors.kernel.org/gnu/xorriso/xorriso-${{ env.XORRISO_VERSION }}.tar.gz"
          tar xzf xorriso.tar.gz

      - name: Build xorriso (Unix)
        if: runner.os != 'Windows'
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cd xorriso-${{ env.XORRISO_DIR }}
          ./configure --disable-libreadline --disable-libacl --disable-xattr
          make -j$NPROC
          strip xorriso/xorriso

      - name: Build xorriso (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd xorriso-${{ env.XORRISO_DIR }}
          ./configure --disable-libreadline --disable-libacl --disable-xattr
          make -j$(nproc)
          # Strip the real binary (not the libtool wrapper stub)
          strip xorriso/.libs/xorriso.exe 2>/dev/null || strip xorriso/xorriso.exe

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/xorriso
          cp xorriso-${{ env.XORRISO_DIR }}/xorriso/xorriso pkg/xorriso/
          echo "${{ env.XORRISO_VERSION }}" > pkg/xorriso/VERSION
          tar czf xorriso-${{ env.XORRISO_VERSION }}-${{ matrix.target }}.tar.gz -C pkg xorriso

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/xorriso
          # Copy the real binary from .libs/ (not the libtool wrapper stub)
          $realBinary = "xorriso-${{ env.XORRISO_DIR }}/xorriso/.libs/xorriso.exe"
          $wrapper = "xorriso-${{ env.XORRISO_DIR }}/xorriso/xorriso.exe"
          if (Test-Path $realBinary) {
            Copy-Item $realBinary pkg/xorriso/
          } else {
            Copy-Item $wrapper pkg/xorriso/
          }
          # Bundle MSYS2 runtime DLLs needed by xorriso
          $msysRoot = "C:\msys64\usr\bin"
          Copy-Item "$msysRoot\msys-2.0.dll" pkg/xorriso/
          Copy-Item "$msysRoot\msys-intl-8.dll" pkg/xorriso/
          Copy-Item "$msysRoot\msys-iconv-2.dll" pkg/xorriso/
          Set-Content -Path pkg/xorriso/VERSION -Value "${{ env.XORRISO_VERSION }}"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg/xorriso -DestinationPath xorriso-${{ env.XORRISO_VERSION }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xorriso-${{ matrix.target }}
          path: xorriso-${{ env.XORRISO_VERSION }}-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  QEMU — system emulators for x64, ARM64 and RISC-V 64
  #  Builds from source with minimal dependencies (headless, no GUI)
  #  Includes edk2 UEFI firmware for ARM64 and RISC-V 64 (OpenSBI, the
  #  RISC-V M-mode firmware, ships in pc-bios/ with the source)
  # ═══════════════════════════════════════════════════════════════════════
  build-qemu:
    name: QEMU ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
    steps:
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-venv \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev \
            libslirp-dev libsdl2-dev libfdt-dev flex bison

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glib pixman ninja python pkg-config libslirp sdl2 dtc

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-dtc
            make flex bison diffutils git

      - name: Download QEMU source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -L -o qemu.tar.xz \
            "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
          tar xf qemu.tar.xz 2>/dev/null || true

      - name: Download QEMU source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -L -o qemu.tar.xz \
            "https://download.qemu.org/qemu-${{ env.QEMU_VERSION }}.tar.xz"
          tar xf qemu.tar.xz 2>/dev/null || true

      - name: Download UEFI firmware
        shell: bash
        run: |
          mkdir -p firmware
          curl -L -o firmware/edk2-aarch64-code.fd.bz2 \
            "https://github.com/qemu/qemu/raw/v${{ env.QEMU_VERSION }}/pc-bios/edk2-aarch64-code.fd.bz2"
          bunzip2 firmware/edk2-aarch64-code.fd.bz2
          # The RISC-V virt machine loads EDK2 from two 32 MiB pflash images:
          # the code and a variable store template the launchers copy.
          for fd in edk2-riscv-code.fd edk2-riscv-vars.fd; do
            curl -L -o "firmware/$fd.bz2" \
              "https://github.com/qemu/qemu/raw/v${{ env.QEMU_VERSION }}/pc-bios/$fd.bz2"
            bunzip2 "firmware/$fd.bz2"
          done

      - name: Build QEMU (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cd qemu-${{ env.QEMU_VERSION }}
          ./configure \
            --target-list=x86_64-softmmu,aarch64-softmmu,riscv64-softmmu \
            --enable-slirp \
            --enable-sdl \
            --disable-docs
          # Build only the binaries we need (skip tests — broken on Windows mingw)
          ninja -C build -j$NPROC qemu-system-x86_64 qemu-system-aarch64 qemu-system-riscv64 qemu-img

      - name: Build QEMU (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd qemu-${{ env.QEMU_VERSION }}
          ./configure \
            --target-list=x86_64-softmmu,aarch64-softmmu,riscv64-softmmu \
            --enable-slirp \
            --enable-sdl \
            --disable-docs
          # Build only the binaries we need (skip tests — broken on Windows mingw)
          ninja -C build -j$(nproc) qemu-system-x86_64.exe qemu-system-aarch64.exe qemu-system-riscv64.exe qemu-img.exe

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BUILD_DIR="qemu-${{ env.QEMU_VERSION }}/build"
          mkdir -p pkg/qemu/share/qemu
          # Find binaries — macOS uses *-unsigned suffix (code signing)
          for bin in qemu-system-x86_64 qemu-system-aarch64 qemu-system-riscv64 qemu-img; do
            SRC=$(find "$BUILD_DIR" -maxdepth 2 \( -name "$bin" -o -name "${bin}-unsigned" \) -type f | head -1)
            if [ -n "$SRC" ]; then
              cp "$SRC" "pkg/qemu/$bin"
            fi
          done
          strip pkg/qemu/qemu-system-* pkg/qemu/qemu-img 2>/dev/null || true
          # Verify binaries exist
          ls -la pkg/qemu/qemu-system-*

          # Bundle shared libraries so QEMU runs without system deps
          mkdir -p pkg/qemu/lib
          collect_deps() {
            local binary="$1"
            if [ "${{ runner.os }}" = "Linux" ]; then
              ldd "$binary" 2>/dev/null | grep "=> /" | awk '{print $3}' || true
            else
              otool -L "$binary" 2>/dev/null | awk '/\/opt\/homebrew|\/usr\/local/{print $1}' || true
            fi
          }
          SKIP_LIBS="libc.so|libm.so|libdl.so|libpthread.so|librt.so|ld-linux|libSystem.B"
          copy_deps() {
            local binary="$1"
            collect_deps "$binary" | while read -r lib; do
              if ! echo "$lib" | grep -qE "$SKIP_LIBS"; then
                cp -n "$lib" pkg/qemu/lib/ 2>/dev/null || true
              fi
            done || true
          }
          # Pass 1: direct deps of QEMU binaries
          for bin in pkg/qemu/qemu-system-x86_64 pkg/qemu/qemu-system-aarch64 pkg/qemu/qemu-system-riscv64 pkg/qemu/qemu-img; do
            [ -f "$bin" ] || continue
            copy_deps "$bin"
          done
          # Pass 2: transitive deps of bundled libs
          for lib in pkg/qemu/lib/*; do
            [ -f "$lib" ] || continue
            copy_deps "$lib"
          done
          echo "Bundled shared libraries:"
          ls -la pkg/qemu/lib/ || echo "(no libraries bundled)"

          # Create wrapper scripts that set library path
          if [ "${{ runner.os }}" = "Linux" ]; then
            LIB_VAR="LD_LIBRARY_PATH"
          else
            LIB_VAR="DYLD_LIBRARY_PATH"
          fi
          for bin in qemu-system-x86_64 qemu-system-aarch64 qemu-system-riscv64 qemu-img; do
            [ -f "pkg/qemu/$bin" ] || continue
            mv "pkg/qemu/$bin" "pkg/qemu/$bin.real"
            {
              echo '#!/bin/sh'
              echo 'DIR="$(cd "$(dirname "$0")" && pwd)"'
              echo "export ${LIB_VAR}=\"\$DIR/lib\${${LIB_VAR}:+:\$${LIB_VAR}}\""
              # QEMU ignores QEMU_DATADIR; it searches exec_dir/../share/qemu.
              # Our layout keeps share/qemu as a sibling of the binary, so pass -L explicitly.
              echo 'exec "$DIR/$(basename "$0").real" -L "$DIR/share/qemu" "$@"'
            } > "pkg/qemu/$bin"
            chmod +x "pkg/qemu/$bin"
          done

          # Copy firmware files from build dir (directories) and source tree (BIOS binaries)
          cp -r "$BUILD_DIR"/pc-bios/* pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.bin pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.rom pkg/qemu/share/qemu/ 2>/dev/null || true
          cp firmware/edk2-aarch64-code.fd firmware/edk2-riscv-code.fd firmware/edk2-riscv-vars.fd pkg/qemu/share/qemu/
          echo "=== Firmware files packaged ==="
          ls pkg/qemu/share/qemu/*.bin pkg/qemu/share/qemu/*.fd 2>/dev/null || echo "WARNING: no firmware files found"
          # Stamp the bundle with its version (see Windows packaging step for rationale)
          echo "${{ env.QEMU_VERSION }}" > pkg/qemu/VERSION
          tar czf qemu-${{ env.QEMU_VERSION }}-${{ matrix.target }}.tar.gz -C pkg qemu

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          BUILD_DIR="qemu-${{ env.QEMU_VERSION }}/build"
          # Universal layout (matches Linux/macOS):
          #   qemu/bin/         exes + transitive DLLs
          #   qemu/share/qemu/  BIOS, ROMs, edk2 firmware
          # QEMU on the MSYS2/MinGW Windows build does not auto-discover its
          # data dir, so launchers (cosmos run, test runner, VS Code extension)
          # always pass -L "<exe_dir>/../share/qemu" — single rule, no OS branch.
          mkdir -p pkg/qemu/bin pkg/qemu/share/qemu
          find "$BUILD_DIR" -maxdepth 2 -name 'qemu-system-x86_64.exe' -type f | head -1 | xargs -I{} cp {} pkg/qemu/bin/
          find "$BUILD_DIR" -maxdepth 2 -name 'qemu-system-aarch64.exe' -type f | head -1 | xargs -I{} cp {} pkg/qemu/bin/
          find "$BUILD_DIR" -maxdepth 2 -name 'qemu-system-riscv64.exe' -type f | head -1 | xargs -I{} cp {} pkg/qemu/bin/
          find "$BUILD_DIR" -maxdepth 2 -name 'qemu-img.exe' -type f | head -1 | xargs -I{} cp {} pkg/qemu/bin/ 2>/dev/null || true
          strip pkg/qemu/bin/*.exe 2>/dev/null || true
          ls -la pkg/qemu/bin/qemu-system-*
          # Copy BIOS/firmware files
          cp -r "$BUILD_DIR"/pc-bios/* pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.bin pkg/qemu/share/qemu/ 2>/dev/null || true
          cp qemu-${{ env.QEMU_VERSION }}/pc-bios/*.rom pkg/qemu/share/qemu/ 2>/dev/null || true
          cp firmware/edk2-aarch64-code.fd firmware/edk2-riscv-code.fd firmware/edk2-riscv-vars.fd pkg/qemu/share/qemu/
          # Bundle MINGW64 runtime DLLs by walking PE imports transitively.
          # objdump -p lists each DLL imported by a binary; we recurse so deps
          # of deps (e.g. libgio -> libgmodule -> libffi) are captured. Anything
          # that doesn't resolve under /mingw64/bin is assumed to be a Windows
          # system DLL (kernel32, ole32, api-ms-win-*) and skipped. DLLs land
          # in pkg/qemu/bin/ alongside the exes so Windows' loader finds them.
          MINGW_BIN="/mingw64/bin"
          declare -A seen
          queue=()
          for exe in pkg/qemu/bin/qemu-system-x86_64.exe pkg/qemu/bin/qemu-system-aarch64.exe pkg/qemu/bin/qemu-system-riscv64.exe pkg/qemu/bin/qemu-img.exe; do
            [ -f "$exe" ] && queue+=("$exe")
          done
          while [ ${#queue[@]} -gt 0 ]; do
            cur="${queue[0]}"
            queue=("${queue[@]:1}")
            base_lc=$(basename "$cur" | tr '[:upper:]' '[:lower:]')
            [ -n "${seen[$base_lc]:-}" ] && continue
            seen[$base_lc]=1
            while IFS= read -r dll; do
              dll_lc=$(echo "$dll" | tr '[:upper:]' '[:lower:]')
              [ -n "${seen[$dll_lc]:-}" ] && continue
              src="$MINGW_BIN/$dll"
              if [ -f "$src" ]; then
                dest="pkg/qemu/bin/$dll"
                [ -f "$dest" ] || cp "$src" "$dest"
                queue+=("$dest")
              fi
            done < <(objdump -p "$cur" 2>/dev/null | awk '/DLL Name:/ {print $3}')
          done
          # Stamp the bundle with its version so the resolver can compare
          # against system-installed QEMU and accept it when versions match.
          echo "${{ env.QEMU_VERSION }}" > pkg/qemu/VERSION
          echo "=== Bundled MINGW64 DLLs ==="
          ls pkg/qemu/bin/*.dll

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg/qemu -DestinationPath qemu-${{ env.QEMU_VERSION }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.target }}
          path: qemu-${{ env.QEMU_VERSION }}-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  GDB — multiarch debugger built from sourceware tarball
  #  Single binary `gdb-multiarch` configured with --enable-targets=all so
  #  the same binary can debug x64 and ARM64 kernels via QEMU's gdbstub.
  # ═══════════════════════════════════════════════════════════════════════
  build-gdb:
    name: GDB ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
    steps:
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo \
            libgmp-dev libmpfr-dev libexpat1-dev libxml2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr expat libxml2 texinfo python@${PYTHON_VERSION}

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            make texinfo bison flex

      - name: Download GDB source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -L -o gdb.tar.xz \
            "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          tar xf gdb.tar.xz

      - name: Download GDB source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -L -o gdb.tar.xz \
            "https://ftp.gnu.org/gnu/gdb/gdb-${GDB_VERSION}.tar.xz"
          tar xf gdb.tar.xz

      # Configure flags rationale:
      #   --enable-targets=all       gdb-multiarch can debug x86, x86_64, arm, aarch64 from one binary
      #   --disable-werror           newer compilers warn on legacy gdb code
      #   --disable-source-highlight drops libsource-highlight runtime dep
      #   --disable-tui              skips ncurses TUI (we drive gdb via cppdbg/MI, not interactive)
      #   --disable-nls              no translations
      #   --with-python=<interp>     embed CPython — gdb scripting (pretty-printers,
      #                              kernel debug helpers) needs it. Must point at an
      #                              interpreter with dev files: the runner's default
      #                              python fails configure's link test on macOS and
      #                              doesn't exist in MSYS2. The python runtime is
      #                              bundled into the artifact at packaging.
      #   --without-guile            no Guile scripting
      # libxml2 is left enabled — QEMU's gdbstub sends XML target descriptions.
      - name: Build GDB (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          # Apple Silicon brew lives at /opt/homebrew, not on the default
          # compiler search path — configure won't find gmp/mpfr/expat
          # headers without the explicit -I/-L. Linux apt installs to
          # /usr/include and /usr/lib so this is a no-op there.
          if [ "$(uname)" = "Darwin" ]; then
            BREW_PREFIX=$(brew --prefix)
            export CPPFLAGS="-I${BREW_PREFIX}/include ${CPPFLAGS:-}"
            export LDFLAGS="-L${BREW_PREFIX}/lib ${LDFLAGS:-}"
            # The python.org framework python preinstalled on the runner
            # fails configure's libpython link test; use brew's.
            PYTHON_BIN="$(brew --prefix python@${PYTHON_VERSION})/bin/python${PYTHON_VERSION}"
          else
            # Links the distro libpython3.x; ubuntu-latest ships dev files.
            PYTHON_BIN=/usr/bin/python3
          fi
          cd gdb-${GDB_VERSION}
          # --target=x86_64-pc-linux-gnu builds gdb as a cross-debugger.
          # Required on macOS aarch64 because upstream has no native
          # debugging backend for that host — without --target, configure
          # auto-excludes the gdb subdir entirely ("This configuration is
          # not supported in the following subdirectories: gdb"). Cosmos
          # kernels are linux-<arch> ELF and we always debug remotely via
          # QEMU's gdbstub, so a cross-debugger is what we want anyway;
          # --enable-targets=all keeps multiarch support at runtime.
          # --disable-{binutils,gas,ld,gprof,gprofng}: skip binutils sister
          # components, build only gdb + its support libs.
          ./configure \
            --target=x86_64-pc-linux-gnu \
            --enable-targets=all \
            --disable-werror \
            --disable-source-highlight \
            --disable-tui \
            --disable-nls \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gprof \
            --disable-gprofng \
            --disable-sim \
            --disable-gdbserver \
            --with-python="${PYTHON_BIN}" \
            --without-guile
          make -j$NPROC
          strip gdb/gdb gdb/gdb-unsigned 2>/dev/null || true

      - name: Build GDB (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd gdb-${GDB_VERSION}
          # See Linux/macOS step: --target=x86_64-pc-linux-gnu makes gdb
          # a cross-debugger (so configure doesn't try native Windows
          # debugging, which has its own complications); --enable-targets=all
          # keeps multiarch support.
          ./configure \
            --target=x86_64-pc-linux-gnu \
            --enable-targets=all \
            --disable-werror \
            --disable-source-highlight \
            --disable-tui \
            --disable-nls \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gprof \
            --disable-gprofng \
            --disable-sim \
            --disable-gdbserver \
            --with-python=/mingw64/bin/python3 \
            --without-guile
          make -j$(nproc)
          strip gdb/gdb.exe

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Layout matches QEMU bundle: gdb/bin/<exe> so the resolver finds it
          # under the same `<asset>/bin/<cmd>` rule it uses for llvm-tools.
          mkdir -p pkg/gdb/bin
          # macOS produces `gdb-unsigned` (codesign is a separate post-build
          # step); Linux produces `gdb`. Pick whichever exists.
          SRC=$(find "gdb-${GDB_VERSION}/gdb" -maxdepth 1 \( -name 'gdb' -o -name 'gdb-unsigned' \) -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: built gdb binary not found under gdb-${GDB_VERSION}/gdb/" >&2
            ls -la "gdb-${GDB_VERSION}/gdb/" >&2
            exit 1
          fi
          cp "$SRC" pkg/gdb/bin/gdb-multiarch
          chmod +x pkg/gdb/bin/gdb-multiarch
          # gdb's data directory (python `gdb` module, syscall XMLs). gdb
          # relocates it relative to its own binary, so <pkg>/bin/gdb-multiarch
          # looks it up at <pkg>/share/gdb.
          mkdir -p pkg/gdb/share/gdb
          for d in python syscalls system-gdbinit; do
            if [ -d "gdb-${GDB_VERSION}/gdb/data-directory/$d" ]; then
              cp -R "gdb-${GDB_VERSION}/gdb/data-directory/$d" pkg/gdb/share/gdb/
            fi
          done
          if [ "$(uname)" = "Darwin" ]; then
            # Bundle the brew CPython runtime so the artifact runs on machines
            # without Homebrew: relink gdb against a copied libpython, ship the
            # stdlib, and set PYTHONHOME through a wrapper script (embedded
            # CPython cannot find its stdlib once the build prefix is gone).
            PYPREFIX="$(brew --prefix python@${PYTHON_VERSION})/Frameworks/Python.framework/Versions/${PYTHON_VERSION}"
            mkdir -p pkg/gdb/lib
            mv pkg/gdb/bin/gdb-multiarch pkg/gdb/bin/gdb-multiarch-bin
            DYLIB=$(otool -L pkg/gdb/bin/gdb-multiarch-bin | awk '/Python.framework|libpython/ {print $1; exit}')
            if [ -z "$DYLIB" ]; then
              echo "ERROR: gdb is not linked against libpython" >&2
              otool -L pkg/gdb/bin/gdb-multiarch-bin >&2
              exit 1
            fi
            cp "$DYLIB" "pkg/gdb/lib/libpython${PYTHON_VERSION}.dylib"
            chmod u+w "pkg/gdb/lib/libpython${PYTHON_VERSION}.dylib"
            install_name_tool -change "$DYLIB" \
              "@executable_path/../lib/libpython${PYTHON_VERSION}.dylib" \
              pkg/gdb/bin/gdb-multiarch-bin
            # install_name_tool invalidates the ad-hoc signature; arm64
            # macOS refuses to run unsigned binaries, so re-sign.
            codesign --force -s - "pkg/gdb/lib/libpython${PYTHON_VERSION}.dylib" pkg/gdb/bin/gdb-multiarch-bin
            cp -R "${PYPREFIX}/lib/python${PYTHON_VERSION}" pkg/gdb/lib/
            rm -rf "pkg/gdb/lib/python${PYTHON_VERSION}/test" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/idlelib" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/tkinter" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/turtledemo" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/ensurepip" \
                   "pkg/gdb/lib/python${PYTHON_VERSION}/site-packages"
            find pkg/gdb/lib -name __pycache__ -type d -prune -exec rm -rf {} +
            printf '%s\n' \
              '#!/bin/sh' \
              'here="$(cd "$(dirname "$0")" && pwd)"' \
              'export PYTHONHOME="${here%/bin}"' \
              'exec "$here/gdb-multiarch-bin" "$@"' \
              > pkg/gdb/bin/gdb-multiarch
            chmod +x pkg/gdb/bin/gdb-multiarch
          fi
          # Smoke test: the packaged gdb must start and its embedded python
          # must reach a working stdlib.
          ./pkg/gdb/bin/gdb-multiarch --batch \
            -ex 'python import sys; print("PYTHON_OK", sys.version)' \
            -ex 'show data-directory' | tee smoke.log
          grep -q PYTHON_OK smoke.log
          echo "${GDB_VERSION}" > pkg/gdb/VERSION
          tar czf gdb-${GDB_VERSION}-${{ matrix.target }}.tar.gz -C pkg gdb

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p pkg/gdb/bin
          # Locate the built binary — the cross-target build can land it
          # under .libs/ (libtool) or the gdb/ root. List candidates first
          # so any path drift surfaces clearly in the log.
          echo "=== Candidate gdb binaries in build dir ==="
          find "gdb-${GDB_VERSION}/gdb" -maxdepth 2 -name 'gdb*.exe' -type f 2>/dev/null
          SRC=$(find "gdb-${GDB_VERSION}/gdb" -maxdepth 2 -name 'gdb.exe' -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: built gdb.exe not found" >&2
            exit 1
          fi
          cp "$SRC" pkg/gdb/bin/gdb-multiarch.exe
          echo "=== Packaged binary ==="
          ls -la pkg/gdb/bin/
          # Walk PE imports to bundle MINGW64 DLLs (same recursive pattern as
          # the QEMU bundle). Anything not under /mingw64/bin is a Windows
          # system DLL (kernel32, ws2_32, …) and is skipped.
          MINGW_BIN="/mingw64/bin"
          declare -A seen
          queue=("pkg/gdb/bin/gdb-multiarch.exe")
          while [ ${#queue[@]} -gt 0 ]; do
            cur="${queue[0]}"
            queue=("${queue[@]:1}")
            base_lc=$(basename "$cur" | tr '[:upper:]' '[:lower:]')
            [ -n "${seen[$base_lc]:-}" ] && continue
            seen[$base_lc]=1
            while IFS= read -r dll; do
              dll_lc=$(echo "$dll" | tr '[:upper:]' '[:lower:]')
              [ -n "${seen[$dll_lc]:-}" ] && continue
              src="$MINGW_BIN/$dll"
              if [ -f "$src" ]; then
                dest="pkg/gdb/bin/$dll"
                [ -f "$dest" ] || cp "$src" "$dest"
                queue+=("$dest")
              fi
            done < <(objdump -p "$cur" 2>/dev/null | awk '/DLL Name:/ {print $3}')
          done
          # Python stdlib — embedded CPython locates it relative to the
          # libpython3.x.dll bundled in bin/ (../lib/python3.x).
          PYVER=$(/mingw64/bin/python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          mkdir -p pkg/gdb/lib
          cp -R "/mingw64/lib/python${PYVER}" pkg/gdb/lib/
          rm -rf "pkg/gdb/lib/python${PYVER}/test" \
                 "pkg/gdb/lib/python${PYVER}/idlelib" \
                 "pkg/gdb/lib/python${PYVER}/tkinter" \
                 "pkg/gdb/lib/python${PYVER}/turtledemo" \
                 "pkg/gdb/lib/python${PYVER}/ensurepip" \
                 "pkg/gdb/lib/python${PYVER}/site-packages"
          find pkg/gdb/lib -name __pycache__ -type d -prune -exec rm -rf {} +
          # gdb's data directory (python `gdb` module, syscall XMLs),
          # relocated by gdb relative to its own binary.
          mkdir -p pkg/gdb/share/gdb
          for d in python syscalls system-gdbinit; do
            if [ -d "gdb-${GDB_VERSION}/gdb/data-directory/$d" ]; then
              cp -R "gdb-${GDB_VERSION}/gdb/data-directory/$d" pkg/gdb/share/gdb/
            fi
          done
          echo "${GDB_VERSION}" > pkg/gdb/VERSION
          echo "=== Bundled MINGW64 DLLs ==="
          ls pkg/gdb/bin/*.dll || echo "(no DLLs bundled — gdb-multiarch.exe must be statically linked)"

      # Runs in pwsh, NOT the msys2 shell: /mingw64 is absent from PATH here,
      # so this proves the bundle is self-contained (DLLs + python stdlib).
      - name: Smoke test bundled gdb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & pkg\gdb\bin\gdb-multiarch.exe --batch -ex 'python import sys; print("PYTHON_OK", sys.version)' -ex 'show data-directory' 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'PYTHON_OK') { exit 1 }

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg/gdb -DestinationPath gdb-${{ env.GDB_VERSION }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gdb-${{ matrix.target }}
          path: gdb-${{ env.GDB_VERSION }}-*.*

  # ═══════════════════════════════════════════════════════════════════════
  #  Release — collect all artifacts and create a GitHub release
  # ═══════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs:
      - build-llvm
      - build-xorriso
      - build-qemu
      - build-gdb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Delete previous release (if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete tools-latest --yes --cleanup-tag --repo ${{ github.repository }} 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-latest
          name: "Cosmos Tools (LLVM ${{ env.LLVM_VERSION }}, QEMU ${{ env.QEMU_VERSION }}, xorriso ${{ env.XORRISO_VERSION }}, GDB ${{ env.GDB_VERSION }})"
          body: |
            Pre-built development tools for Cosmos kernel development.

            ## Versions
            | Tool | Version |
            |------|---------|
            | LLVM (Clang + LLD) | ${{ env.LLVM_VERSION }} |
            | xorriso | ${{ env.XORRISO_VERSION }} |
            | QEMU | ${{ env.QEMU_VERSION }} |
            | GDB (multiarch) | ${{ env.GDB_VERSION }} |

            ## Platforms
            - `linux-x64` — .tar.gz archives
            - `darwin-arm64` — .tar.gz archives
            - `win-x64` — .zip archives
          files: artifacts/*
          draft: false
          prerelease: false
