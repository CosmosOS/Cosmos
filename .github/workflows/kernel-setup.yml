name: Kernel Setup

on:
  workflow_call:

jobs:
  build:
    name: Build Cosmos Packages & Cache Tools
    runs-on: ubuntu-24.04
    # A cold riscv64 toolchain build (the cross JIT, then CoreLib) adds about
    # five minutes on a hosted runner; cached, it adds none.
    timeout-minutes: 30
    strategy:
      matrix:
        dotnet-version: [ 10.0.x ]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🛠️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: 🗑️ Clear NuGet Cache
        run: dotnet nuget locals all --clear

      # The riscv64 cross JIT and CoreLib are built from the dotnet/runtime
      # submodule (nuget.org has neither). build-riscv64-toolchain.sh skips the
      # build when these outputs and its stamp match the submodule's commit, so
      # caching them on that commit (and on the script) builds them once per
      # runtime bump.
      - name: 🔑 riscv64 Toolchain Cache Key
        id: riscv64-key
        run: echo "commit=$(git -C dotnet/runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache riscv64 Toolchain
        id: riscv64-cache
        uses: actions/cache@v4
        with:
          path: |
            dotnet/runtime/artifacts/bin/coreclr/linux.x64.Release/libclrjit_unix_riscv64_x64.so
            dotnet/runtime/artifacts/bin/coreclr/linux.riscv64.Release/aotsdk
            dotnet/runtime/artifacts/.cosmos-riscv64-toolchain
          key: riscv64-toolchain-${{ steps.riscv64-key.outputs.commit }}-${{ hashFiles('.devcontainer/build-riscv64-toolchain.sh') }}

      - name: 🧰 Install riscv64 Toolchain Build Prerequisites
        if: steps.riscv64-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build python3

      - name: 📦 Build and Install Cosmos Packages (multi-arch)
        run: ./.devcontainer/postCreateCommand.sh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          # Adds riscv64 to every package and builds Cosmos.Build.Ilc.RISCV64.
          COSMOS_RISCV64: 1

      - name: 📤 Upload Cosmos Packages
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-packages
          path: artifacts/package/release/*.nupkg
          retention-days: 1

      - name: 🔧 Cache Build Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/.cosmos/tools
          key: cosmos-tools-linux-x64-${{ hashFiles('.github/workflows/build-tools.yml') }}

      - name: 📥 Download Build Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOLS_DIR="$HOME/.cosmos/tools"
          mkdir -p "$TOOLS_DIR"
          echo "Downloading tools from release: tools-latest"
          for asset in llvm-tools xorriso qemu; do
            gh release download tools-latest --pattern "${asset}-*-linux-x64.tar.gz" --dir /tmp/cosmos-tools
            tar xzf /tmp/cosmos-tools/${asset}-*-linux-x64.tar.gz -C "$TOOLS_DIR"
          done

      - name: 🔗 Add Tools to PATH
        run: |
          TOOLS_DIR="$HOME/.cosmos/tools"
          echo "$TOOLS_DIR/llvm-tools/bin" >> $GITHUB_PATH
          echo "$TOOLS_DIR/xorriso" >> $GITHUB_PATH
          echo "$TOOLS_DIR/qemu" >> $GITHUB_PATH

      - name: 🔍 Verify Tools Installation
        run: cosmos check
