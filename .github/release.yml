# Shapes the notes `generate_release_notes` writes into each GitHub release
# (see create-release in release.yml), so a Gen3 release reads like the Gen2
# User Kits: merged pull requests grouped under Features, Bug Fixes and
# Improvements instead of one flat "What's Changed" list. New Contributors and
# the Full Changelog link are appended by GitHub and need no configuration.
#
# A pull request lands in the first category whose labels it matches, so the
# "*" catch-all has to stay last or it would swallow everything below it.
# Anything unlabelled, or labelled documentation / test / arm64 / x64 and the
# like, therefore lands under Improvements.
changelog:
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Improvements
      labels:
        - "*"
